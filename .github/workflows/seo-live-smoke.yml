name: SEO live smoke
on:
  push:
    paths:
      - .github/workflows/seo-live-smoke.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify live pages
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 30); do
            a=$(curl -fsSL https://saibanwatch.github.io/gender-sentencing.html || true)
            b=$(curl -fsSL https://saibanwatch.github.io/topics/nonconsensual-intercourse.html || true)
            c=$(curl -fsSL https://saibanwatch.github.io/cases/official-95878-detail3.html || true)
            if printf '%s' "$a" | grep -q '司法の「女割」はある' \
              && printf '%s' "$b" | grep -q 'バキュームフェラ事件' \
              && printf '%s' "$c" | grep -q '口腔性交を不同意性交等罪として重く処罰するのは合憲か'; then
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" = 1
          printf 'verified\n' > seo-live-check.txt
      - name: Commit verification marker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seo-live-check.txt
          git commit -m "Verify high-intent SEO pages live"
          git push
