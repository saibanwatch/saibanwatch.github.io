name: Analytics Smoke Test
on:
  push:
    paths:
      - ".github/workflows/analytics-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production assets
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 2 https://saibanwatch.github.io/ -o /tmp/index.html
          curl --fail --silent --show-error --retry 5 --retry-delay 2 https://saibanwatch.github.io/analytics.js -o /tmp/analytics.js
          grep -q 'log_analytics_event_v1' /tmp/analytics.js
          grep -q 'COURTWATCH_ANALYTICS' /tmp/analytics.js
          grep -q '裁判ウォッチ' /tmp/index.html

      - name: Execute production page in a real browser
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$chrome"
          "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --user-agent='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/154.0.0.0 Safari/537.36' \
            --virtual-time-budget=5000 --dump-dom \
            'https://saibanwatch.github.io/?utm_source=analytics_smoke&utm_medium=browser&utm_campaign=smoke_20261003' \
            > /tmp/browser-dom.html
          grep -q '裁判ウォッチ' /tmp/browser-dom.html

      - name: Verify analytics RPC over HTTPS
        shell: bash
        env:
          SUPABASE_KEY: sb_publishable_HhXl8I3L4z-UF168b6wSiQ_WrQXa1Uc
        run: |
          set -euo pipefail
          endpoint='https://czhssdmwilnbrexqmtqg.supabase.co/rest/v1/rpc/log_analytics_event_v1'
          visitor='38b89c6a-a1ea-4320-aa04-91d3741a581f'
          session='765c4451-5a40-489a-94de-1d5cc0db9e2c'
          post_event() {
            event_id="$1"
            event_name="$2"
            detail="$3"
            payload="{\"p_event_id\":\"$event_id\",\"p_event_name\":\"$event_name\",\"p_event_detail\":\"$detail\",\"p_page_type\":\"home\",\"p_entity_type\":null,\"p_entity_key\":null,\"p_path\":\"/\",\"p_referrer_host\":\"direct\",\"p_traffic_source\":\"direct\",\"p_traffic_medium\":\"none\",\"p_campaign\":null,\"p_device_type\":\"desktop\",\"p_visitor_id\":\"$visitor\",\"p_session_id\":\"$session\",\"p_previous_path\":null,\"p_duration_ms\":null}"
            code=$(curl --silent --show-error -o /tmp/rpc.out -w '%{http_code}' \
              -X POST "$endpoint" \
              -H 'Origin: https://saibanwatch.github.io' \
              -H "apikey: $SUPABASE_KEY" \
              -H "Authorization: Bearer $SUPABASE_KEY" \
              -H 'Content-Type: application/json' \
              -H 'Prefer: return=minimal' \
              --data "$payload")
            test "$code" = "200" -o "$code" = "204"
          }
          post_event '81048c62-9afd-4555-a205-c945f699f05c' 'page_view' ''
          post_event '81048c62-9afd-4555-a205-c945f699f05c' 'page_view' ''
          post_event '782c76cf-d77d-41ca-ba4b-728738d41ba7' 'page_view' ''
          post_event '1f0cd517-dd18-4d9d-a988-29c0e8352029' 'search_run' 'query'
          post_event '1f0cd517-dd18-4d9d-a988-29c0e8352029' 'search_run' 'query'
