name: Refresh SEO
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-seo.yml"
      - "scripts/refresh-sitemap.mjs"
      - "scripts/submit-indexnow.mjs"
      - "**/*.html"
      - "robots.txt"
      - "feed.xml"
      - "sitemap.xml"
      - "sitemap.txt"
      - "sitemaps/**"
      - "seo.css"
      - "21d6e780c8c007515162b511ae98a991668a603d437c5119.txt"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-seo
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Rebuild search pages and sitemaps
        run: node scripts/refresh-sitemap.mjs
      - name: Detect SEO changes
        id: changes
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- index.html cases people topics courts years case-archive people.html topics.html courts.html years.html all-cases.html latest.html criminal.html civil.html administrative.html acquittals.html sentencing.html gender-sentencing.html debates.html statistics.html feed.xml sitemap.xml sitemap.txt sitemaps)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Notify IndexNow
        if: steps.changes.outputs.changed == 'true' || (github.event_name == 'push' && github.actor != 'github-actions[bot]')
        run: node scripts/submit-indexnow.mjs
      - name: Commit generated SEO changes
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html cases people topics courts years case-archive people.html topics.html courts.html years.html all-cases.html latest.html criminal.html civil.html administrative.html acquittals.html sentencing.html gender-sentencing.html debates.html statistics.html feed.xml sitemap.xml sitemap.txt sitemaps
          git commit -m "Refresh static search pages"
          git fetch origin main
          git rebase origin/main
          git push origin main
