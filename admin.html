<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>運営管理 | 裁判ウォッチ</title>
  <meta name="robots" content="noindex,nofollow">
  <style>
    :root{--bg:#f6f7f9;--panel:#fff;--ink:#111827;--muted:#667085;--line:#e5e7eb;--accent:#163a63;--danger:#9b1c31;--ok:#246b45}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;line-height:1.55}
    header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
    .nav{max-width:1180px;margin:auto;padding:14px 18px;display:flex;align-items:center;gap:12px}.nav b{color:var(--accent);font-size:19px}.spacer{flex:1}
    button,input,select,textarea{font:inherit}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 11px;cursor:pointer}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.danger{color:var(--danger)}.btn.ok{color:var(--ok)}
    main{max-width:1180px;margin:22px auto;padding:0 18px}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}.panel h2{margin:0 0 12px;font-size:18px}.muted{color:var(--muted);font-size:13px}
    .login{max-width:460px;margin:60px auto}.field{margin:11px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:4px}.field input{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 11px}
    .stats{display:grid;grid-template-columns:repeat(7,minmax(120px,1fr));gap:10px;overflow:auto}.stat{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:12px}.stat b{font-size:22px;display:block}.stat span{font-size:11px;color:var(--muted)}
    .tabs{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.tab{white-space:nowrap}.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
    .item{border-top:1px solid var(--line);padding:14px 0}.item:first-child{border-top:0}.item-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.badge{font-size:11px;padding:3px 7px;border-radius:999px;background:#eef2f6;color:#344054}.badge.open{background:#fff1f2;color:#9f1239}.badge.hidden{background:#fff7ed;color:#9a3412}.badge.visible{background:#ecfdf3;color:#166534}
    .body{white-space:pre-wrap;margin:8px 0;font-size:14px}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}.empty{padding:18px;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}
    .case-edit{display:grid;grid-template-columns:1.2fr .8fr 1fr .6fr auto;gap:8px;align-items:center}.case-edit input,.case-edit select{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px}
    .candidate-box{margin-top:9px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#f8fafc}.candidate-box b{font-size:13px}.candidate-cases{margin:6px 0 0;padding-left:18px;color:var(--muted);font-size:12px}.candidate-note{font-size:11px;color:var(--muted);margin-top:6px}.same-name{color:var(--ok);font-weight:700}.candidate-form{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.candidate-form input,.candidate-form select,.candidate-form textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;background:#fff}.candidate-form textarea{grid-column:1/-1;min-height:72px;resize:vertical}@media(max-width:760px){.candidate-form{grid-template-columns:1fr}.candidate-form textarea{grid-column:auto}}
    @media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}.case-edit{grid-template-columns:1fr}.item-head{flex-direction:column}}
  </style>
</head>
<body>
<header><div class="nav"><b>裁判ウォッチ 運営管理</b><span class="muted">管理者専用</span><div class="spacer"></div><a class="btn" href="index.html">公開サイト</a><button class="btn" id="logoutBtn" style="display:none">ログアウト</button></div></header>

<main>
  <section id="loginPanel" class="panel login">
    <h2>管理者ログイン</h2>
    <p class="muted">通常の裁判ウォッチアカウントでログインします。管理者リストに登録されたアカウントのみ管理画面を表示します。</p>
    <div class="field"><label>メールアドレス</label><input id="email" type="email" autocomplete="email"></div>
    <div class="field"><label>パスワード</label><input id="password" type="password" autocomplete="current-password"></div>
    <button class="btn primary" id="loginBtn">ログイン</button>
    <p class="muted" style="margin-top:10px"><a href="reset-password.html" style="color:#245b91">パスワードを忘れた場合</a></p>
    <p id="loginStatus" class="muted"></p>
  </section>

  <section id="app" style="display:none">
    <div class="panel">
      <div class="stats">
        <div class="stat"><b id="sReports">–</b><span>未処理通報</span></div>
        <div class="stat"><b id="sCorrections">–</b><span>未処理訂正</span></div>
        <div class="stat"><b id="sVisible">–</b><span>公開投稿</span></div>
        <div class="stat"><b id="sHidden">–</b><span>非表示投稿</span></div>
        <div class="stat"><b id="sUsers">–</b><span>ユーザー</span></div>
        <div class="stat"><b id="sCases">–</b><span>事件</span></div>
        <div class="stat"><b id="sPeople">–</b><span>人物</span></div>
      </div>
    </div>

    <div class="tabs">
      <button class="btn tab active" data-tab="reports">投稿通報</button>
      <button class="btn tab" data-tab="tag-reports">タグ通報</button>
      <button class="btn tab" data-tab="corrections">訂正依頼</button>
      <button class="btn tab" data-tab="posts">投稿</button>
      <button class="btn tab" data-tab="cases">掲載事件</button>
      <button class="btn tab" data-tab="quality">要約不足</button>
      <button class="btn tab" data-tab="people-linking">人物照合</button>\n      <button class="btn tab" data-tab="people-profiles">人物情報</button>
      <button class="btn tab" data-tab="users">ユーザー</button>
      <button class="btn tab" data-tab="ad-free">広告非表示</button>
      <button class="btn tab" data-tab="ingestion">収集ログ</button>\n      <button class="btn tab" data-tab="traffic">アクセス</button>
      <button class="btn tab" data-tab="logs">操作履歴</button>
      <button class="btn" id="refreshBtn">再読込</button><button class="btn primary" id="runIngestBtn">新着＋全文を取得</button><button class="btn" id="runBackfillBtn">過去判決PDFを補完</button>
    </div>

    <section class="panel"><div id="content"><div class="empty">読み込み中...</div></div></section>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://czhssdmwilnbrexqmtqg.supabase.co";
const SUPABASE_KEY="sb_publishable_HhXl8I3L4z-UF168b6wSiQ_WrQXa1Uc";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let user=null,currentTab="reports",peopleLinkPeople=new Map(),peopleLinkCases=new Map(),peopleLinkMentions=new Map();
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const dt=s=>s?new Date(s).toLocaleString("ja-JP"):"";
const content=document.getElementById("content");

async function checkAdmin(){
  const {data:{user:u}}=await sb.auth.getUser(); user=u||null;
  if(!user){showLogin();return false}
  const {data,error}=await sb.rpc("is_admin");
  if(error||data!==true){
    document.getElementById("loginStatus").textContent="このアカウントには管理者権限がありません。";
    await sb.auth.signOut(); user=null; showLogin(); return false;
  }
  showApp(); await refreshAll(); return true;
}
function showLogin(){document.getElementById("loginPanel").style.display="block";document.getElementById("app").style.display="none";document.getElementById("logoutBtn").style.display="none"}
function showApp(){document.getElementById("loginPanel").style.display="none";document.getElementById("app").style.display="block";document.getElementById("logoutBtn").style.display="inline-block"}

document.getElementById("loginBtn").onclick=async()=>{
  const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;
  document.getElementById("loginStatus").textContent="確認中...";
  const {error}=await sb.auth.signInWithPassword({email,password});
  if(error){document.getElementById("loginStatus").textContent="ログインできませんでした。";return}
  await checkAdmin();
};
document.getElementById("logoutBtn").onclick=async()=>{await sb.auth.signOut();user=null;showLogin()};
document.getElementById("refreshBtn").onclick=()=>refreshAll();
document.getElementById("runIngestBtn").onclick=async()=>{
  const btn=document.getElementById("runIngestBtn");
  if(!confirm("裁判所公式の新着裁判例を確認し、全文PDFも取得しますか？"))return;
  btn.disabled=true;btn.textContent="取得中...";
  try{
    const {data,error}=await sb.functions.invoke("court-sync",{body:{mode:"recent",enrich_limit:6}});
    if(error)throw error;
    const rows=data?.results||[];
    const found=rows.reduce((n,r)=>n+Number(r.found||0),0);
    const upserted=rows.reduce((n,r)=>n+Number(r.upserted||0),0);
    const enriched=rows.reduce((n,r)=>n+Number(r.enriched||0),0);
    const documents=rows.reduce((n,r)=>n+Number(r.documents||0),0);
    const errors=rows.reduce((n,r)=>n+Number(r.errors||0),0);
    alert("取得完了\n検出: "+found+"件\n事件更新: "+upserted+"件\n情報補完: "+enriched+"件\nPDF取得: "+documents+"件\nエラー: "+errors+"件");
    await refreshAll();
  }catch(e){
    console.error(e);
    alert("裁判例の取得に失敗しました。収集ログとブラウザのコンソールを確認してください。");
  }finally{
    btn.disabled=false;btn.textContent="新着＋全文を取得";
  }
};
document.getElementById("runBackfillBtn").onclick=async()=>{
  const btn=document.getElementById("runBackfillBtn");
  if(!confirm("未処理の過去判決から最大8件、公式全文PDFを取得して情報を補完しますか？"))return;
  btn.disabled=true;btn.textContent="補完中...";
  try{
    const {data,error}=await sb.functions.invoke("court-sync",{body:{mode:"backfill",limit:8}});
    if(error)throw error;
    const row=(data?.results||[])[0]||{};
    alert("補完完了\n対象: "+Number(row.found||0)+"件\n情報補完: "+Number(row.enriched||0)+"件\nPDF取得: "+Number(row.documents||0)+"件\nエラー: "+Number(row.errors||0)+"件");
    await refreshAll();
  }catch(e){
    console.error(e);
    alert("全文PDFの補完に失敗しました。収集ログを確認してください。");
  }finally{
    btn.disabled=false;btn.textContent="過去判決PDFを補完";
  }
};
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");currentTab=b.dataset.tab;loadTab()});

async function refreshAll(){await loadStats();await loadTab()}
async function loadStats(){
  const {data,error}=await sb.rpc("admin_stats");
  if(error||!data?.length)return;
  const s=data[0];
  sReports.textContent=s.open_reports;sCorrections.textContent=s.pending_corrections;sVisible.textContent=s.visible_posts;sHidden.textContent=s.hidden_posts;sUsers.textContent=s.users;sCases.textContent=s.cases;sPeople.textContent=s.people;
}

async function loadTab(){
  content.innerHTML='<div class="empty">読み込み中...</div>';
  if(currentTab==="reports")return loadReports();
  if(currentTab==="tag-reports")return loadTagReports();
  if(currentTab==="corrections")return loadCorrections();
  if(currentTab==="posts")return loadPosts();
  if(currentTab==="cases")return loadCases();
  if(currentTab==="quality")return loadQuality();
  if(currentTab==="people-linking")return loadPeopleLinking();
  if(currentTab==="people-profiles")return loadPeopleProfiles();
  if(currentTab==="users")return loadUsers();
  if(currentTab==="ad-free")return loadAdFreeUsers();
  if(currentTab==="ingestion")return loadIngestion();
  if(currentTab==="traffic")return loadTraffic();
  if(currentTab==="logs")return loadLogs();
}

async function loadReports(){
  const {data,error}=await sb.from("reports").select("id,post_id,reason,status,created_at,moderator_note").order("created_at",{ascending:false}).limit(100);
  if(error){content.innerHTML='<div class="empty">通報を取得できません。</div>';return}
  const postIds=[...new Set((data||[]).map(x=>x.post_id))];
  const {data:posts}=postIds.length?await sb.from("posts").select("id,body,status,created_at").in("id",postIds):{data:[]};
  const pm=Object.fromEntries((posts||[]).map(p=>[p.id,p]));
  content.innerHTML=data?.length?data.map(r=>{const p=pm[r.post_id]||{};return `
    <div class="item">
      <div class="item-head"><div><b>通報</b> <span class="badge ${esc(r.status)}">${esc(r.status)}</span><div class="muted">${esc(dt(r.created_at))}</div></div></div>
      <div class="body"><b>理由:</b> ${esc(r.reason)}\n\n<b>対象投稿:</b> ${esc(p.body||"投稿を取得できません")}</div>
      <div class="actions">
        ${p.id?'<button class="btn danger" onclick="setPostStatus(\''+p.id+'\',\'hidden\')">投稿を非表示</button>':""}
        ${p.id?'<button class="btn ok" onclick="setPostStatus(\''+p.id+'\',\'visible\')">投稿を復元</button>':""}
        <button class="btn ok" onclick="resolveReport('${r.id}','resolved')">対応済み</button>
        <button class="btn" onclick="resolveReport('${r.id}','dismissed')">問題なし</button>
      </div>
    </div>`}).join(""):'<div class="empty">通報はありません。</div>';
}

async function loadTagReports(){
  const {data,error}=await sb.rpc("admin_list_tag_reports");
  if(error){content.innerHTML='<div class="empty">タグ通報を取得できません。</div>';console.error(error);return}
  const rows=data||[];
  const caseIds=[...new Set(rows.filter(r=>r.target_type==="case").map(r=>r.target_id))];
  const personIds=[...new Set(rows.filter(r=>r.target_type==="person").map(r=>r.target_id))];
  const mentionIds=[...new Set(rows.filter(r=>r.target_type==="mention").map(r=>r.target_id))];
  const [cases,people,mentions]=await Promise.all([
    caseIds.length?sb.from("cases").select("id,title").in("id",caseIds):Promise.resolve({data:[]}),
    personIds.length?sb.from("people").select("id,display_name").in("id",personIds):Promise.resolve({data:[]}),
    mentionIds.length?sb.from("case_people_mentions").select("id,display_name,cases(title)").in("id",mentionIds):Promise.resolve({data:[]})
  ]);
  const cm=Object.fromEntries((cases.data||[]).map(x=>[x.id,x.title]));
  const pm=Object.fromEntries((people.data||[]).map(x=>[x.id,x.display_name]));
  const mm=Object.fromEntries((mentions.data||[]).map(x=>[x.id,(x.display_name||"判決文記載人物")+(x.cases?.title?" / "+x.cases.title:"")]));
  const label=r=>r.target_type==="case"?(cm[r.target_id]||r.target_id):r.target_type==="person"?(pm[r.target_id]||r.target_id):(mm[r.target_id]||r.target_id);
  content.innerHTML=rows.length?rows.map(r=>`
    <div class="item">
      <div class="item-head"><div><b>#${esc(r.tag_name)}</b> <span class="badge ${esc(r.link_status)}">${esc(r.link_status)}</span><div class="muted">${esc(label(r))} · 支持 ${Number(r.support_count||0)} · 未処理通報 ${Number(r.open_reports||0)} · ${esc(dt(r.created_at))}</div></div><span class="badge ${esc(r.report_status)}">${esc(r.report_status)}</span></div>
      <div class="body"><b>通報理由:</b> ${esc(r.reason)}</div>
      <div class="actions">
        ${r.link_status==="visible"?'<button class="btn danger" onclick="setTagLinkStatus(\''+r.link_id+'\',\'hidden\')">この対象で非表示</button>':'<button class="btn ok" onclick="setTagLinkStatus(\''+r.link_id+'\',\'visible\')">この対象で復元</button>'}
        <button class="btn danger" onclick="setTagStatus('${r.tag_id}','hidden')">タグ自体を全体非表示</button>
        ${r.report_status==="open"?'<button class="btn ok" onclick="resolveTagReport(\''+r.report_id+'\',\'resolved\')">対応済み</button><button class="btn" onclick="resolveTagReport(\''+r.report_id+'\',\'dismissed\')">問題なし</button>':""}
      </div>
    </div>`).join(""):'<div class="empty">タグ通報はありません。</div>';
}

async function loadCorrections(){
  const {data,error}=await sb.from("correction_requests").select("id,case_id,person_id,reason,supporting_url,status,created_at,moderator_note").order("created_at",{ascending:false}).limit(100);
  if(error){content.innerHTML='<div class="empty">訂正依頼を取得できません。</div>';return}
  content.innerHTML=data?.length?data.map(r=>`
    <div class="item">
      <div class="item-head"><div><b>訂正依頼</b> <span class="badge ${esc(r.status)}">${esc(r.status)}</span><div class="muted">${esc(dt(r.created_at))}</div></div></div>
      <div class="body">${esc(r.reason)}</div>
      ${r.supporting_url?'<p><a target="_blank" rel="noopener" href="'+esc(r.supporting_url)+'">根拠URLを開く</a></p>':""}
      <div class="muted">対象: ${r.case_id?"事件 "+esc(r.case_id):"人物 "+esc(r.person_id)}</div>
      <div class="actions"><button class="btn ok" onclick="resolveCorrection('${r.id}','accepted')">採用</button><button class="btn" onclick="resolveCorrection('${r.id}','rejected')">却下</button><button class="btn" onclick="resolveCorrection('${r.id}','resolved')">確認済み</button></div>
    </div>`).join(""):'<div class="empty">訂正依頼はありません。</div>';
}

async function loadPosts(){
  const {data,error}=await sb.from("posts").select("id,body,status,created_at,case_id,person_id").order("created_at",{ascending:false}).limit(100);
  if(error){content.innerHTML='<div class="empty">投稿を取得できません。</div>';return}
  content.innerHTML=data?.length?data.map(p=>`
    <div class="item"><div class="item-head"><div><span class="badge ${esc(p.status)}">${esc(p.status)}</span><span class="muted"> ${esc(dt(p.created_at))}</span></div></div>
    <div class="body">${esc(p.body)}</div><div class="muted">${p.case_id?"事件投稿":"人物投稿"}</div>
    <div class="actions"><button class="btn ok" onclick="setPostStatus('${p.id}','visible')">公開</button><button class="btn danger" onclick="setPostStatus('${p.id}','hidden')">非表示</button><button class="btn danger" onclick="setPostStatus('${p.id}','deleted')">削除扱い</button></div></div>`).join(""):'<div class="empty">投稿はありません。</div>';
}

async function loadQuality(){
  const {data,error}=await sb.rpc("admin_summary_queue",{p_limit:100});
  if(error){content.innerHTML='<div class="empty">要約の不足一覧を取得できませんでした。</div>';console.error(error);return}
  if(!data?.length){content.innerHTML='<div class="empty">現在、要約の不足は見つかりません。</div>';return}
  content.innerHTML='<p class="muted">要約が未完成の事件を最大100件表示しています。判決全文の取得済みを優先します。未登録項目を推測で補完せず、原資料を確認してください。</p>'+
  data.map(c=>'<div class="item"><div class="item-head"><div><b>'+esc(c.title||"無題")+'</b>'+
     '<div class="muted">'+esc(c.court||"")+(c.event_date?" · "+esc(c.event_date):"")+
     ' · 状態: '+esc(c.summary_status||"未登録")+
     (c.has_parsed_fulltext?' · 全文解析済み':c.has_pdf_url?' · PDFあり':' · PDF未確認')+
     '</div></div><div class="actions">'+
       '<a class="btn" target="_blank" rel="noopener noreferrer" href="case.html?id='+encodeURIComponent(c.case_id)+'">事件を開く</a>'+
       (c.source_url?'<a class="btn" target="_blank" rel="noopener noreferrer" href="'+esc(c.source_url)+'">原資料</a>':'')+
     '</div></div></div>').join("");
}

async function loadCases(){
  const {data,error}=await sb.from("cases").select("id,title,court,status,event_date,updated_at,raw_metadata").order("event_date",{ascending:false}).limit(150);
  if(error){content.innerHTML='<div class="empty">事件を取得できません。</div>';return}
  content.innerHTML=data?.length?data.map(c=>`
    <div class="item"><div class="case-edit">
      <input id="title-${c.id}" value="${esc(c.title)}">
      <input id="court-${c.id}" value="${esc(c.court||"")}">
      <input id="aliases-${c.id}" value="${esc((Array.isArray(c.raw_metadata?.alternate_names)?c.raw_metadata.alternate_names:[]).join("｜"))}" placeholder="別名・報道上の呼称（｜区切り）">
      <input id="status-${c.id}" value="${esc(c.status||"")}">
      <button class="btn primary" onclick="saveCase('${c.id}')">保存</button>
    </div><div class="muted">${esc(c.event_date||"")} · 最終更新 ${esc(dt(c.updated_at))}</div></div>`).join(""):'<div class="empty">事件はありません。</div>';
}


async function loadPeopleProfiles(){
  const {data,error}=await sb.from("people")
    .select("id,display_name,role,organization,birth_date,sex,birthplace,overview,background,bio,verification_status")
    .eq("verification_status","verified")
    .order("display_name");
  if(error){content.innerHTML='<div class="empty">人物情報を取得できません。</div>';console.error(error);return}
  content.innerHTML=(data||[]).length?(data||[]).map(p=>
    '<div class="item">'+
      '<div class="item-head"><div><b>'+esc(p.display_name)+'</b> <span class="badge">'+esc(p.role)+'</span>'+
      (p.organization?'<div class="muted">'+esc(p.organization)+'</div>':'')+'</div></div>'+
      '<div class="candidate-form">'+
        '<input id="profile-birth-'+esc(p.id)+'" type="date" value="'+esc(p.birth_date||"")+'">'+
        '<select id="profile-sex-'+esc(p.id)+'">'+

async function loadPeopleLinking(){
  const [{data:mentions,error:me},{data:people,error:pe},{data:links,error:le}]=await Promise.all([
    sb.from("case_people_mentions")
      .select("id,case_id,person_id,candidate_person_id,display_name,role,role_label,source_url,confidence,created_at,cases(title,court,event_date)")
      .is("person_id",null)
      .order("created_at",{ascending:false})
      .limit(200),
    sb.from("people")
      .select("id,display_name,role,organization,verification_status,profile_url,source_url,bio,birth_date,sex,birthplace,overview,background")
      .order("display_name"),
    sb.from("case_people")
      .select("person_id,role_label,cases(id,title,court,event_date,status)")
  ]);
  if(me||pe||le){content.innerHTML='<div class="empty">人物照合データを取得できません。</div>';console.error(me||pe||le);return}

  peopleLinkPeople=new Map((people||[]).map(p=>[p.id,p]));
  peopleLinkMentions=new Map((mentions||[]).map(m=>[m.id,m]));
  peopleLinkCases=new Map();
  (links||[]).forEach(r=>{
    if(!peopleLinkCases.has(r.person_id))peopleLinkCases.set(r.person_id,[]);
    if(r.cases)peopleLinkCases.get(r.person_id).push({...r.cases,role_label:r.role_label});
  });
  peopleLinkCases.forEach(rows=>rows.sort((a,b)=>String(b.event_date||"").localeCompare(String(a.event_date||""))));

  const byRole={judge:[],prosecutor:[],lawyer:[]};
  (people||[]).filter(p=>p.verification_status==="verified").forEach(p=>{if(byRole[p.role])byRole[p.role].push(p)});
  if(!mentions?.length){content.innerHTML='<div class="empty">未照合の判決文記載人物はありません。</div>';return}

  const exactCount=mentions.filter(m=>(byRole[m.role]||[]).some(p=>p.display_name===m.display_name)).length;
  const head='<div class="item"><b>未照合 '+mentions.length+'件</b> · <span class="same-name">同名の確認済み候補あり '+exactCount+'件</span>'+
    '<div class="actions"><input id="peopleLinkSearch" class="btn" style="min-width:320px" placeholder="氏名・事件名・裁判所で絞り込み" oninput="filterPeopleLinking(this.value)"></div>'+
    '<div class="candidate-note">同名は本人確認の根拠ではありません。判決文・公式プロフィール・所属・過去事件を突き合わせて確認してください。</div></div>';

  content.innerHTML=head+mentions.map(m=>{
    const candidates=[...(byRole[m.role]||[])].sort((a,b)=>{
      const ae=a.display_name===m.display_name?0:1,be=b.display_name===m.display_name?0:1;
      return ae-be||String(a.display_name||"").localeCompare(String(b.display_name||""),"ja");
    });
    const exact=candidates.filter(p=>p.display_name===m.display_name);
    const opts=candidates.map(p=>{
      const cases=(peopleLinkCases.get(p.id)||[]).length;
      const same=p.display_name===m.display_name?"【同名】":"";
      return '<option value="'+esc(p.id)+'">'+same+esc(p.display_name)+(p.organization?' — '+esc(p.organization):'')+' — 掲載'+cases+'件</option>';
    }).join("");
    const cc=m.cases||{};
    return '<div class="item person-link-item">'+
      '<div class="item-head"><div><b>'+esc(m.display_name)+'</b> <span class="badge">'+esc(m.role_label||m.role)+'</span>'+
      (exact.length?'<span class="badge same-name">同名候補 '+exact.length+'件</span>':'')+
      '<div class="muted">'+esc(cc.title||"")+(cc.court?' · '+esc(cc.court):'')+(cc.event_date?' · '+esc(cc.event_date):'')+'</div></div></div>'+
      '<div class="body">判決文抽出名: '+esc(m.display_name)+'\n抽出信頼度: '+esc(m.confidence==null?"":m.confidence)+'%</div>'+
      (m.source_url?'<p><a target="_blank" rel="noopener" href="'+esc(m.source_url)+'">判決文を確認</a></p>':'')+
      '<div class="actions">'+
        '<select id="person-match-'+esc(m.id)+'" class="btn" style="min-width:320px" onchange="showPersonLinkPreview(\''+esc(m.id)+'\')"><option value="">確認済み人物を選択</option>'+opts+'</select>'+
        '<button class="btn primary" onclick="linkMentionPerson(\''+esc(m.id)+'\')">この人物に紐付け</button>'+
      '</div>'+
      '<div id="person-preview-'+esc(m.id)+'" class="candidate-box" style="display:none"></div>'+
      renderPendingCandidate(m)+
      '<div class="candidate-note">既存人物への紐付けも、新規候補の確認済み化も、名前一致だけでは実行しないでください。</div>'+
    '</div>';
  }).join("");
}

      '<select id="candidate-sex-'+esc(m.id)+'"><option value=""'+(!p.sex?' selected':'')+'>性別：未確認</option><option value="male"'+(p.sex==="male"?' selected':'')+'>男性</option><option value="female"'+(p.sex==="female"?' selected':'')+'>女性</option><option value="other"'+(p.sex==="other"?' selected':'')+'>その他</option></select>'+
      '<input id="candidate-birthplace-'+esc(m.id)+'" value="'+esc(p.birthplace||"")+'" placeholder="出身地">'+
      '<textarea id="candidate-overview-'+esc(m.id)+'" placeholder="概要">'+esc(p.overview||p.bio||"")+'</textarea>'+
      '<textarea id="candidate-background-'+esc(m.id)+'" placeholder="経歴・生い立ち">'+esc(p.background||"")+'</textarea>'+
    '</div>'+
    '<div class="candidate-note">確認資料: '+(p.source_url?'<a target="_blank" rel="noopener" href="'+esc(p.source_url)+'">判決文・資料を開く</a>':"未登録")+'</div>'+
    '<div class="actions">'+
      '<button class="btn" onclick="savePersonCandidate(\''+esc(m.id)+'\')">候補情報を保存</button>'+
      '<button class="btn ok" onclick="verifyPersonCandidate(\''+esc(m.id)+'\')">確認済みにする</button>'+
    '</div>'+
    '<div class="candidate-note">「確認済みにする」は、判決文と公式情報等を照合して本人同一性を確認した後に実行してください。</div>'+
  '</div>';
}

async function createPersonCandidate(mentionId){
  const mention=peopleLinkMentions.get(mentionId);
  if(!mention)return;
  if(!confirm("「"+mention.display_name+"」の管理用確認候補を作成しますか？\nこの時点では公開人物にはなりません。"))return;
  const {error}=await sb.rpc("admin_create_person_candidate_from_mention",{p_mention_id:mentionId});
  if(error){alert("確認候補を作成できませんでした。");console.error(error);return}

}

async function verifyPersonCandidate(mentionId){
  const mention=peopleLinkMentions.get(mentionId);
  const p=mention?.candidate_person_id?peopleLinkPeople.get(mention.candidate_person_id):null;
  if(!p){alert("確認候補がありません。");return}
  const org=document.getElementById("candidate-org-"+mentionId)?.value.trim()||"";
  const profile=document.getElementById("candidate-profile-"+mentionId)?.value.trim()||"";
  const message="「"+p.display_name+"」を確認済み人物として公開し、この事件の正式な関係者に紐付けます。\n\n判決文に加え、本人同一性を確認できる公式情報・所属等を確認しましたか？"+(!profile?"\n\n※ 公式プロフィールURLが未入力です。":"");
  if(!confirm(message))return;
  const organization=org||null;
  const profile_url=profile||null;
  const birth_date=document.getElementById("candidate-birth-"+mentionId)?.value||null;
  const sex=document.getElementById("candidate-sex-"+mentionId)?.value||null;
  const birthplace=document.getElementById("candidate-birthplace-"+mentionId)?.value.trim()||null;
  const overview=document.getElementById("candidate-overview-"+mentionId)?.value.trim()||null;
  const background=document.getElementById("candidate-background-"+mentionId)?.value.trim()||null;
  const {error:saveError}=await sb.from("people").update({organization,profile_url,birth_date,sex,birthplace,overview,background}).eq("id",p.id);
  if(saveError){alert("候補情報を保存できませんでした。");console.error(saveError);return}
  const {error}=await sb.rpc("admin_verify_person_candidate",{p_mention_id:mentionId});
  if(error){alert("確認済みに更新できませんでした。");console.error(error);return}
  alert("確認済み人物として登録し、事件の関係者へ正式に反映しました。");
  await refreshAll();
}

function showPersonLinkPreview(mentionId){
  const sel=document.getElementById("person-match-"+mentionId);
  const box=document.getElementById("person-preview-"+mentionId);
  const personId=sel?.value||"";
  if(!box)return;
  if(!personId){box.style.display="none";box.innerHTML="";return}
  const p=peopleLinkPeople.get(personId);
  if(!p){box.style.display="none";return}
  const rows=peopleLinkCases.get(personId)||[];
  const links=[
    p.profile_url?'<a target="_blank" rel="noopener" href="'+esc(p.profile_url)+'">公式プロフィール</a>':"",
    p.source_url?'<a target="_blank" rel="noopener" href="'+esc(p.source_url)+'">確認資料</a>':""
  ].filter(Boolean).join(" · ");
  const cases=rows.length
    ?'<ul class="candidate-cases">'+rows.slice(0,8).map(x=>'<li>'+esc(x.event_date||"日付不明")+' '+esc(x.court||"")+' — '+esc(x.title||"")+'</li>').join("")+'</ul>'
    :'<div class="candidate-note">掲載事件なし</div>';
  box.innerHTML='<b>'+esc(p.display_name)+'</b>'+
    '<div class="muted">'+esc(p.organization||"所属情報未掲載")+' · 掲載事件 '+rows.length+'件</div>'+
    ((p.overview||p.bio)?'<div class="body">'+esc(p.overview||p.bio)+'</div>':'')+
    (links?'<div>'+links+'</div>':'')+
    cases;
  box.style.display="block";
}

function filterPeopleLinking(query){
  const q=String(query||"").trim().toLowerCase();
  document.querySelectorAll(".person-link-item").forEach(el=>{
    el.style.display=!q||el.textContent.toLowerCase().includes(q)?"":"none";
  });
}

async function linkMentionPerson(mentionId){
  const mention=peopleLinkMentions.get(mentionId);
  const mentionName=mention?.display_name||"";
  const sel=document.getElementById("person-match-"+mentionId);
  const personId=sel?.value||"";

    ?"同名ですが、同名だけでは本人確認になりません。判決文・公式情報・所属等を確認済みですか？"

  alert("紐付けました。事件の正式な関係者にも自動反映されています。");

async function loadTraffic(){
  const [summaryRes,dailyRes,topRes,refRes,googleRes]=await Promise.all([
    sb.rpc("admin_traffic_summary"),
    sb.rpc("admin_traffic_daily",{p_days:30}),
    sb.rpc("admin_traffic_top_pages",{p_days:30,p_limit:20}),
    sb.rpc("admin_traffic_referrers",{p_days:30,p_limit:20}),
    sb.rpc("admin_google_landing_pages",{p_days:30,p_limit:20})
  ]);
  if(summaryRes.error||dailyRes.error||topRes.error||refRes.error||googleRes.error){
    content.innerHTML='<div class="empty">アクセス統計を取得できません。</div>';
    console.error(summaryRes.error||dailyRes.error||topRes.error||refRes.error||googleRes.error);
    return;
  }
  const s=(summaryRes.data||[])[0]||{};
  const top=topRes.data||[];
  const refs=refRes.data||[];
  const google=googleRes.data||[];
  const uuid=/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
  const allPages=[...top,...google];
  const caseIds=[...new Set(allPages.filter(r=>r.page_type==="case"&&uuid.test(r.entity_id||"")).map(r=>r.entity_id))];
  const personIds=[...new Set(allPages.filter(r=>r.page_type==="person"&&uuid.test(r.entity_id||"")).map(r=>r.entity_id))];
  const [caseRes,personRes]=await Promise.all([
    caseIds.length?sb.from("cases").select("id,title").in("id",caseIds):Promise.resolve({data:[]}),
    personIds.length?sb.from("people").select("id,display_name").in("id",personIds):Promise.resolve({data:[]})
  ]);
  const caseMap=Object.fromEntries((caseRes.data||[]).map(x=>[x.id,x.title]));
  const personMap=Object.fromEntries((personRes.data||[]).map(x=>[x.id,x.display_name]));
  const label=r=>r.page_type==="case"?(caseMap[r.entity_id]||"事件 "+(r.entity_id||"")):r.page_type==="person"?(personMap[r.entity_id]||"人物 "+(r.entity_id||"")):r.path;
  const refLabel=x=>x==="internal"?"サイト内":x==="direct"?"直接・参照元なし":x==="google.com"||x==="google.co.jp"?"Google":x==="chatgpt.com"?"ChatGPT":x;
  const stat=(v,t)=>'<div class="stat"><b>'+Number(v||0).toLocaleString("ja-JP")+'</b><span>'+t+'</span></div>';
  const daily=(dailyRes.data||[]).slice().reverse();
  content.innerHTML=
    '<div class="stats">'+
      stat(s.today_pv,"今日 PV")+stat(s.today_visitors,"今日 訪問者")+
      stat(s.yesterday_pv,"昨日 PV")+stat(s.yesterday_visitors,"昨日 訪問者")+
      stat(s.last7_pv,"7日 PV")+stat(s.last7_visitors,"7日 訪問者")+

async function loadLogs(){
  const {data,error}=await sb.from("moderation_log").select("id,admin_id,action,target_type,target_id,note,created_at").order("created_at",{ascending:false}).limit(200);
  if(error){content.innerHTML='<div class="empty">操作履歴を取得できません。</div>';return}
  content.innerHTML=data?.length?data.map(r=>`
    <div class="item"><div class="item-head"><div><b>${esc(r.action)}</b><div class="muted">${esc(dt(r.created_at))} · ${esc(r.target_type)} ${esc(r.target_id)}</div></div></div>
    ${r.note?'<div class="body">'+esc(r.note)+'</div>':""}</div>`).join(""):'<div class="empty">操作履歴はありません。</div>';
}

async function loadIngestion(){
  const {data,error}=await sb.from("ingestion_runs").select("id,source,started_at,finished_at,found_count,upserted_count,enriched_count,document_count,error_count,notes").order("started_at",{ascending:false}).limit(50);
  if(error){content.innerHTML='<div class="empty">収集ログを取得できません。</div>';return}
  content.innerHTML=data?.length?data.map(r=>`
    <div class="item"><div class="item-head"><div><b>${esc(r.source)}</b><div class="muted">${esc(dt(r.started_at))}</div></div><span class="badge">${Number(r.error_count||0)?"error "+r.error_count:"OK"}</span></div>
    <div class="body">検出 ${esc(r.found_count)} / 事件反映 ${esc(r.upserted_count)} / 情報補完 ${esc(r.enriched_count||0)} / PDF ${esc(r.document_count||0)} / エラー ${esc(r.error_count)}${r.notes?"\n"+esc(r.notes):""}</div></div>`).join(""):'<div class="empty">収集ログはありません。</div>';
}

async function saveCase(id){
  const title=document.getElementById("title-"+id).value.trim();
  const court=document.getElementById("court-"+id).value.trim();
  const status=document.getElementById("status-"+id).value.trim();
  const alternate_names=[...new Set(document.getElementById("aliases-"+id).value.split(/[|｜\n]+/).map(x=>x.trim()).filter(Boolean))].slice(0,8);
  const {data:row,error:readError}=await sb.from("cases").select("raw_metadata").eq("id",id).single();
  if(readError){alert("現在の事件情報を取得できませんでした。");console.error(readError);return}
  const raw_metadata={...(row?.raw_metadata||{}),alternate_names};
  const {error}=await sb.from("cases").update({title,court,status,raw_metadata,updated_at:new Date().toISOString()}).eq("id",id);
  if(error){alert("保存できませんでした。");console.error(error);return}alert("保存しました。");
}
