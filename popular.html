<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>注目されている事件・新着裁判 | 裁判ウォッチ</title>
<meta name="description" content="裁判ウォッチ掲載事件の閲覧傾向と新着裁判をまとめています。アクセス数が少ない場合は新着事件を掲載します。">
<meta name="robots" content="index,follow"><link rel="canonical" href="https://saibanwatch.github.io/popular.html">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#222;font:14px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif}
a{color:#3b6b96;text-decoration:none}a:hover{text-decoration:underline}header{background:#fff;border-bottom:1px solid #ddd;padding:12px max(14px,calc((100% - 900px)/2))}header a{font-size:20px;font-weight:800;color:#333}
main{max-width:900px;margin:20px auto;padding:0 14px}.panel{background:#fff;border:1px solid #ddd;border-radius:7px;padding:18px;margin-bottom:12px}.panel h1{margin:0 0 7px;font-size:24px}.panel h2{margin:0 0 10px;font-size:18px}.note{font-size:12px;color:#666}
.controls{display:flex;gap:8px;margin:12px 0}.controls button{font:inherit;padding:7px 12px;background:#fff;border:1px solid #aaa;border-radius:5px;cursor:pointer}.controls button.active{background:#e05a3f;color:#fff;border-color:#e05a3f}
.event{border-top:1px solid #ececec;padding:12px 0}.event:first-child{border-top:0}.event b{font-size:16px}.meta{color:#777;font-size:12px;margin-top:3px}
footer{max-width:900px;margin:20px auto;padding:10px 14px 30px;font-size:12px;color:#777}
</style>
<script defer src="/analytics.js"></script></head><body>
<header><a href="./">裁判ウォッチ</a></header><main>
<section class="panel"><h1>注目されている事件</h1>
<p>サイト内の閲覧状況をもとに、関心が集まっている裁判を表示します。閲覧者数が少ない場合、ランキングは表示しません。</p>
<div class="controls" role="group" aria-label="集計期間"><button data-days="7" type="button">直近7日</button><button class="active" data-days="30" type="button">直近30日</button><button data-days="90" type="button">直近90日</button></div>
<div id="popularList" aria-live="polite"><p class="note">集計中...</p></div>
<p class="note">閲覧数はサイト内計測によるもので、一般の関心を代表する統計ではありません。同じ利用者の複数閲覧も含まれます。ランキングは異なる閲覧者が3人以上の事件に限定しています。</p></section>
<section class="panel"><h2>新着裁判</h2><div id="latestList" aria-live="polite">読み込み中...</div><p><a href="latest.html">新着・更新された裁判をもっと見る →</a></p></section>
</main><footer><a href="./">トップ</a> · <a href="all-cases.html">事件一覧</a> · <a href="topics.html">テーマ別</a> · <a href="people.html">人物一覧</a> · <a href="privacy.html">プライバシー</a></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=window.supabase.createClient("https://czhssdmwilnbrexqmtqg.supabase.co","sb_publishable_HhXl8I3L4z-UF168b6wSiQ_WrQXa1Uc");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const renderCase=(c,detail)=>'<div class="event"><a href="cases/'+encodeURIComponent(c.slug)+'.html"><b>'+esc(c.title)+'</b></a><div class="meta">'+esc(c.court||"")+(c.event_date?" · "+esc(c.event_date):"")+(detail?" · "+esc(detail):"")+'</div></div>';
async function loadPopular(days){
 const el=document.getElementById("popularList");el.textContent="集計中...";
 const {data,error}=await sb.rpc("popular_cases_public",{p_days:days});
 if(error){el.textContent="閲覧ランキングを取得できませんでした。";return}
 if(!data?.length){el.innerHTML='<p class="note">この期間はランキングの集計基準を満たす事件がありません。以下の新着裁判からご覧ください。</p>';return}
 el.innerHTML=data.filter(c=>c.slug).map((c,i)=>renderCase(c,(i+1)+"位 · 閲覧者 "+c.visitors+"人")).join("");
}
async function loadLatest(){
 const el=document.getElementById("latestList");
 const {data,error}=await sb.from("cases").select("slug,title,court,event_date")
   .eq("is_demo",false).not("slug","is",null).order("event_date",{ascending:false}).limit(12);
 if(error){el.textContent="新着裁判を取得できませんでした。";return}
 el.innerHTML=(data||[]).filter(c=>c.slug).map(c=>renderCase(c,"")).join("")||'<p class="note">表示できる事件はありません。</p>';
}
document.querySelectorAll("[data-days]").forEach(b=>b.addEventListener("click",()=>{
 document.querySelectorAll("[data-days]").forEach(x=>x.classList.toggle("active",x===b));
 loadPopular(Number(b.dataset.days));
}));
loadPopular(30);loadLatest();
</script></body></html>
